services:
  a2a-orchestration-agent:
    build: .
    container_name: a2a-orchestration-agent
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_MODEL_FALLBACKS=${GEMINI_MODEL_FALLBACKS:-gemini-2.5-flash}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-256}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_MODEL_FALLBACKS=${GROQ_MODEL_FALLBACKS:-llama-3.3-70b-versatile}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-1024}
      - AGENT_MAX_ITERATIONS=${AGENT_MAX_ITERATIONS:-8}
      - SIMULATE_TRANSIENT_FAILURES=${SIMULATE_TRANSIENT_FAILURES:-false}
      - DATA_SOURCE_CSV=${DATA_SOURCE_CSV:-/app/sales_data.csv}
      # Add your custom environment variables here
    stdin_open: true
    ports:
      - "5001:5000"
    tty: true
    networks:
      - agents-net

networks:
  agents-net:
    driver: bridge
